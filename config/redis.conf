bind 127.0.0.1
protected-mode yes
port 6379
daemonize no

timeout 0
tcp-keepalive 300
databases 16

dir ./data/redis
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000

appendonly yes
appenddirname appendonlydir
appendfilename appendonly.aof
appendfsync everysec

maxmemory 256mb
maxmemory-policy allkeys-lru
