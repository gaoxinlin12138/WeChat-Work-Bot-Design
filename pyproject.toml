[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wecom-knowledge-bot"
version = "0.1.0"
description = "企业微信智能知识库与产品报价机器人"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=45,<47",
  "defusedxml>=0.7,<1.0",
  "fastapi>=0.116,<1.0",
  "openai>=2.0,<3.0",
  "langgraph>=1.2.12,<2.0",
  "langgraph-checkpoint-postgres>=3.1.2,<4.0",
  "openpyxl>=3.1,<4.0",
  "Pillow>=11,<13",
  "pdfplumber>=0.11,<1.0",
  "pypdf>=6.0,<7.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "wecom-aibot-python-sdk>=1.0.2,<2.0",
  "pydantic-settings>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pgvector>=0.4,<1.0",
  "structlog>=25.4,<26.0",
  "redis>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "httpx2>=2.13,<3.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # Latest Starlette 1.6 still imports this AnyIO compatibility alias.
  "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\\.testclient",
  # Latest official WeCom SDK 1.0.2 still uses the websockets legacy client.
  "ignore:websockets\\.client\\.WebSocketClientProtocol is deprecated:DeprecationWarning:aibot\\.ws",
  "ignore:websockets\\.legacy is deprecated:DeprecationWarning:websockets\\.legacy",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
